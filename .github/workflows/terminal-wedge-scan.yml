name: Terminal Wedge Full-Market Scan

on:
  push:
    branches:
      - terminal-wedge-scan-20260801
    paths:
      - '.github/workflows/terminal-wedge-scan.yml'
      - 'tools/terminal_wedge/**'

permissions:
  contents: write

concurrency:
  group: terminal-wedge-scan-20260801
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout scan branch
        uses: actions/checkout@v4
        with:
          ref: terminal-wedge-scan-20260801
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas numpy matplotlib requests urllib3 openpyxl tabulate pytdx

      - name: Scan Shanghai and Shenzhen main boards
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          rm -rf scan_results/terminal_wedge_20260801
          python tools/terminal_wedge/run_full_scan.py \
            --count 340 \
            --max-workers 8 \
            --min-score 42 \
            --top-charts 25 \
            --output scan_results/terminal_wedge_20260801

      - name: Add run metadata
        if: always()
        run: |
          mkdir -p scan_results/terminal_wedge_20260801
          {
            echo "workflow_run=${GITHUB_RUN_ID}"
            echo "workflow_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "source_commit=${GITHUB_SHA}"
            echo "generated_at_utc=$(date -u +%FT%TZ)"
          } > scan_results/terminal_wedge_20260801/run_metadata.txt

      - name: Upload scan artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terminal-wedge-scan-20260801
          path: scan_results/terminal_wedge_20260801
          if-no-files-found: warn
          retention-days: 30

      - name: Commit scan results to branch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scan_results/terminal_wedge_20260801
          if git diff --cached --quiet; then
            echo "No result changes to commit"
          else
            git commit -m "data: terminal wedge full-market results 2026-08-01 [skip ci]"
            git push origin HEAD:terminal-wedge-scan-20260801
          fi
