name: Probe Official SSE Symbol List

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-terminal-wedge-once.yml'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: terminal-wedge-scan-20260801
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests
      - name: Probe SSE list
        run: |
          mkdir -p scan_results/terminal_wedge_20260801
          python - <<'PY' 2>&1 | tee scan_results/terminal_wedge_20260801/sse_list_probe.txt
          import re, requests, traceback
          urls=['https://www.sse.com.cn/js/common/ssesuggestdata.js','http://www.sse.com.cn/js/common/ssesuggestdata.js']
          for url in urls:
            try:
              r=requests.get(url,headers={'User-Agent':'Mozilla/5.0','Referer':'https://www.sse.com.cn/'},timeout=20)
              r.encoding=r.apparent_encoding or 'utf-8'
              print('url',url,'status',r.status_code,'bytes',len(r.content),'encoding',r.encoding)
              print('head',repr(r.text[:500]))
              patterns=[
                r'val\s*:\s*["\'](\d{6})["\']\s*,\s*val2\s*:\s*["\']([^"\']+)',
                r'val\s*:\s*"(\d{6})".*?val2\s*:\s*"([^"]+)"',
              ]
              for p in patterns:
                m=re.findall(p,r.text)
                print('pattern',p,'matches',len(m),'sample',m[:10])
            except Exception:
              traceback.print_exc()
          PY
      - name: Commit probe
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scan_results/terminal_wedge_20260801/sse_list_probe.txt
          git commit -m "diag: probe SSE symbol list [skip ci]" || true
          git push origin HEAD:terminal-wedge-scan-20260801
