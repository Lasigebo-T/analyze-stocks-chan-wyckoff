name: Run Terminal Wedge Scan Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-terminal-wedge-once.yml'

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout scan implementation
        uses: actions/checkout@v4
        with:
          ref: terminal-wedge-scan-20260801
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas numpy matplotlib requests urllib3 openpyxl tabulate

      - name: Run full Shanghai/Shenzhen main-board scan
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          rm -rf scan_results/terminal_wedge_20260801
          python tools/terminal_wedge/scan_terminal_wedge.py \
            --count 340 \
            --max-workers 8 \
            --min-score 50 \
            --top-charts 20 \
            --output scan_results/terminal_wedge_20260801
          {
            echo "workflow_run=${GITHUB_RUN_ID}"
            echo "workflow_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "source_commit=${GITHUB_SHA}"
            echo "generated_at_utc=$(date -u +%FT%TZ)"
          } > scan_results/terminal_wedge_20260801/run_metadata.txt

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: terminal-wedge-scan-20260801
          path: scan_results/terminal_wedge_20260801
          retention-days: 30

      - name: Commit results to scan branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scan_results/terminal_wedge_20260801
          if git diff --cached --quiet; then
            echo "No result changes"
          else
            git commit -m "data: terminal wedge scan results 2026-08-01 [skip ci]"
            git push origin HEAD:terminal-wedge-scan-20260801
          fi
