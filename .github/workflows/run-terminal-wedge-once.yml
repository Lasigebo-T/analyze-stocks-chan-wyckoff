name: Diagnose A-Share Universe Sources

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-terminal-wedge-once.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout scan branch
        uses: actions/checkout@v4
        with:
          ref: terminal-wedge-scan-20260801
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install diagnostic dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas requests openpyxl akshare pytdx

      - name: Diagnose universe endpoints
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          mkdir -p scan_results/terminal_wedge_20260801
          python - <<'PY' | tee scan_results/terminal_wedge_20260801/universe_diagnostics.txt
          import json, traceback
          import pandas as pd
          import requests

          print('=== Eastmoney clist ===')
          url='https://82.push2.eastmoney.com/api/qt/clist/get'
          params={
              'pn':1,'pz':6000,'po':1,'np':1,'fltt':2,'invt':2,'fid':'f3',
              'fs':'m:0+t:6,m:0+t:80,m:1+t:2,m:1+t:23',
              'fields':'f12,f14,f2,f3,f5,f6,f8,f9,f20,f21'
          }
          try:
              r=requests.get(url,params=params,headers={'User-Agent':'Mozilla/5.0','Referer':'https://quote.eastmoney.com/'},timeout=20)
              print('status',r.status_code,'len',len(r.content),'url',r.url)
              print('text head',repr(r.text[:500]))
              j=r.json(); print('top keys',list(j)[:20]); d=(j.get('data') or {}); print('data keys',list(d)[:20])
              diff=d.get('diff'); print('diff type',type(diff).__name__,'len',len(diff) if diff is not None else None)
              if isinstance(diff,dict): print('first dict item',next(iter(diff.items()),None))
              elif isinstance(diff,list): print('first list item',diff[:1])
          except Exception:
              traceback.print_exc()

          print('\n=== Public indicator workbook ===')
          raw='https://raw.githubusercontent.com/89529738/ashare-public-data/main/data/股票池合并_核准_技术指标_latest.xlsx'
          try:
              xf=pd.ExcelFile(raw)
              print('sheets',xf.sheet_names)
              for sheet in xf.sheet_names[:3]:
                  df=pd.read_excel(raw,sheet_name=sheet,nrows=5,dtype=str)
                  print('sheet',sheet,'shape',df.shape)
                  print('columns',list(map(str,df.columns)))
                  print(df.head().to_string(index=False))
          except Exception:
              traceback.print_exc()

          print('\n=== AKShare lists ===')
          try:
              import akshare as ak
              for fn in ('stock_info_a_code_name','stock_zh_a_spot_em'):
                  try:
                      f=getattr(ak,fn); df=f(); print(fn,'shape',df.shape,'columns',list(df.columns)); print(df.head().to_string(index=False))
                  except Exception as e:
                      print(fn,'FAILED',type(e).__name__,str(e)); traceback.print_exc(limit=2)
          except Exception:
              traceback.print_exc()

          print('\n=== pytdx code tables ===')
          try:
              from pytdx.hq import TdxHq_API
              servers=[('119.147.212.81',7709),('47.103.48.45',7709),('124.71.187.72',7709),('218.108.47.69',7709)]
              for host,port in servers:
                  api=TdxHq_API(heartbeat=True,auto_retry=True,raise_exception=True)
                  try:
                      ok=api.connect(host,port,time_out=3)
                      print(host,port,'connect',ok)
                      if ok:
                          for market in (0,1):
                              count=api.get_security_count(market)
                              first=api.get_security_list(market,0)
                              print(' market',market,'count',count,'first',first[:3] if first else first)
                          api.disconnect(); break
                  except Exception as e:
                      print(host,port,'FAILED',type(e).__name__,str(e))
                      try: api.disconnect()
                      except Exception: pass
          except Exception:
              traceback.print_exc()
          PY

      - name: Commit diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scan_results/terminal_wedge_20260801/universe_diagnostics.txt
          git commit -m "diag: inspect A-share universe sources [skip ci]" || true
          git push origin HEAD:terminal-wedge-scan-20260801
